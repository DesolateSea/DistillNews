    <style>

<body>
    <div class="container">
        <div class="header">
            <div class="shield-icon">&#x1F6E1;&#xFE0F;</div>
            <h1>Just a quick check</h1>
            <p class="subtitle">We&#x2019;re checking your connection to prevent automated abuse</p>
        </div>

        <div class="turnstile-wrapper" id="turnstileWrapper">
            <div id="turnstile-container"></div>
        </div>

        <div class="status-message" id="statusMessage" role="alert" aria-live="polite">
            <span class="status-icon" id="statusIcon"></span>
            <span class="status-text" id="statusText"></span>
        </div>

        <div class="footer">
            <a href="https://sciencex.com/help/antibot/" class="help-link">Why am I seeing this?</a><br>
            <a href="https://sciencex.com/help/feedback/" class="help-link">Having problems? Contact support</a>
        </div>
    </div>

    <script>
        (function () {
            'use strict';

            var FETCH_TIMEOUT_MS = 10000;

            var widgetId = null;
            var isVerifying = false;
            var interactiveStart = null;
            var interactiveMs = 0;

            var turnstileWrapper = document.getElementById('turnstileWrapper');
            var statusIcon = document.getElementById('statusIcon');
            var statusText = document.getElementById('statusText');
            var statusMessage = document.getElementById('statusMessage');

            /* ── Status helpers ── */

            function showStatus(icon, text) {
                statusIcon.textContent = icon;
                statusText.textContent = text;
                statusMessage.classList.add('active');
            }

            function hideStatus() {
                statusMessage.classList.remove('active');
            }

            /* ── Reset back to widget after a failed attempt ── */

            function resetToWidget() {
                isVerifying = false;
                interactiveStart = null;
                interactiveMs = 0;
                turnstileWrapper.style.display = '';
                if (widgetId !== null) {
                    turnstile.reset(widgetId);
                }
            }

            /* ── STEP 1: Render Turnstile immediately on load ── */

            window.onTurnstileLoad = function () {
                try {
                    widgetId = turnstile.render('#turnstile-container', {
                        sitekey: '0x4AAAAAACBj9mZsQb1CA1iA',
                        theme: 'auto',
                        size: 'flexible',
                        appearance: 'always',
                        callback: onTurnstileSuccess,
                        'error-callback': onTurnstileError,
                        'expired-callback': onTurnstileExpired,
                        'before-interactive-callback': function () {
                            interactiveStart = Date.now();
                        },
                        'after-interactive-callback': function () {
                            if (interactiveStart !== null) {
                                interactiveMs = Date.now() - interactiveStart;
                                interactiveStart = null;
                            }
                        }
                    });
                } catch (err) {
                    console.error('Turnstile render error:', err);
                    showStatus('\u26A0\uFE0F', 'Could not load security check. Please refresh the page.');
                }
            };

            async function collectFingerprint() {
                const start = performance.now()
                const signals = {}

                signals.webgl = (() => {
                    try {
                        const gl = document.createElement('canvas').getContext('webgl')
                        const ext = gl?.getExtension('WEBGL_debug_renderer_info')
                        return {
                            renderer: ext ? gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) : null,
                            vendor: ext ? gl.getParameter(ext.UNMASKED_VENDOR_WEBGL) : null,
                        }
                    } catch (e) { return { error: e.constructor.name } }
                })();

                signals.hardware = (() => {
                    try {
                        return {
                            cores: navigator.hardwareConcurrency ?? null,
                            memory: navigator.deviceMemory ?? null,
                            maxTouchPoints: navigator.maxTouchPoints ?? null,
                            screen: {
                                w: screen.width,
                                h: screen.height,
                                availW: screen.availWidth,
                                availH: screen.availHeight,
                                colorDepth: screen.colorDepth,
                                pixelRatio: window.devicePixelRatio ?? null,
                                outerW: window.outerWidth,
                                outerH: window.outerHeight,
                                outerHeightZero: window.outerHeight === 0,
                                screenX: window.screenX != null ? window.screenX : (window.screenLeft != null ? window.screenLeft : null),
                                screenY: window.screenY != null ? window.screenY : (window.screenTop != null ? window.screenTop : null),
                                orientationType: screen.orientation ? screen.orientation.type : null,
                            },
                        }
                    } catch (e) { return { error: e.constructor.name } }
                })();

                signals.fonts = (() => {
                    try {
                        const ctx = document.createElement('canvas').getContext('2d')
                        const TEST = 'mmmmmmmmmmlli'
                        const BASES = ['monospace', 'serif', 'sans-serif']
                        const baseWidths = BASES.map(b => { ctx.font = `72px ${b}`; return ctx.measureText(TEST).width })

                        if (baseWidths[0] === 0 || baseWidths.every(w => w === baseWidths[0])) {
                            return { error: 'CanvasMeasurementSuppressed' }
                        }

                        const present = font => {
                            const results = BASES.map((b, i) => {
                                ctx.font = `72px '${font}', ${b}`
                                return ctx.measureText(TEST).width !== baseWidths[i]
                            })
                            return results.filter(Boolean).length >= 2
                        };

                        return {
                            'SegoeUI': present('Segoe UI'),
                            'Cantarell': present('Cantarell'),
                            'HiraginoSans': present('Hiragino Sans'),
                            'Roboto': present('Roboto'),
                            'DroidSans': present('Droid Sans Fallback'),
                        }
                    } catch (e) { return { error: e.constructor.name } }
                })();


                try {
                    signals.uaData = navigator.userAgentData
                        ? await navigator.userAgentData.getHighEntropyValues([
                            'platform', 'platformVersion', 'architecture', 'fullVersionList', 'mobile'
                        ]).then(hints => ({
                            brands: hints.fullVersionList ?? null,
                            platform: hints.platform ?? null,
                            platformVersion: hints.platformVersion ?? null,
                            architecture: hints.architecture ?? null,
                            mobile: hints.mobile ?? null,
                            uaString: navigator.userAgent,
                            languages: navigator.languages ? navigator.languages.length : 0,
                        }))
                        : null
                } catch { signals.uaData = null }

                signals.collectionTimeMs = Math.round(performance.now() - start)

                return signals
            }

            /* ── STEP 2: Token received — fire verification immediately ── */

            function onTurnstileSuccess(token) {
                if (isVerifying) return;
                isVerifying = true;
                hideStatus();

                Promise.race([
                    collectFingerprint(),
                    new Promise(function (resolve) { setTimeout(function () { resolve({}); }, 3000); })
                ])
                    .catch(function () { return {}; })
                    .then(function (fingerprint) { verifyToken(token, fingerprint); });
            }

            function onTurnstileError() {
                var isFirefox = navigator.userAgent.indexOf('Firefox') !== -1;
                var msg = isFirefox
                    ? 'Security check failed. If you use Firefox with Strict tracking protection or have DevTools open, please disable them and reload.'
                    : 'Security check failed. Please reload the page.';
                showStatus('\u26A0\uFE0F', msg);
            }

            function onTurnstileExpired() {
                showStatus('\u2139\uFE0F', 'Verification expired. Resetting\u2026');
                resetToWidget();
            }

            /* ── STEP 3: Server-side token verification, then reload ── */

            function verifyToken(token, fingerprint) {
                var submitUrl = document.documentElement.getAttribute('data-submit-url')
                    || window.location.pathname.replace(/\/$/, '');

                var controller = new AbortController();
                var timeoutId = setTimeout(function () { controller.abort(); }, FETCH_TIMEOUT_MS);

                fetch(submitUrl, {
                    method: 'POST',
                    signal: controller.signal,
                    headers: {
                        'Content-Type': 'application/json',
                        'x-turnstile-token': token,
                        'x-request-ts': document.documentElement.getAttribute('data-server-ts') || '',
                        'x-interactive-solve-ms': String(interactiveMs)
                    },
                    body: JSON.stringify(fingerprint || {})
                })
                    .then(function (response) {
                        clearTimeout(timeoutId);

                        if (response.ok) {
                            setTimeout(function () {
                                turnstileWrapper.style.display = 'none';
                                showStatus('\u23F3', 'Redirecting\u2026');
                            }, 1500);
                            window.location.reload();
                            return;
                        }

                        var msg = response.status === 422
                            ? 'Verification was rejected. Please try again.'
                            : 'Server error (' + response.status + '). Please try again.';

                        handleVerificationError(msg);
                    })
                    .catch(function (err) {
                        clearTimeout(timeoutId);

                        var msg = err.name === 'AbortError'
                            ? 'Request timed out. Please check your connection and try again.'
                            : 'Network error. Please check your connection and try again.';

                        console.error('Verification fetch error:', err);
                        handleVerificationError(msg);
                    });
            }

            /* ── Error handling ── */

            function handleVerificationError(msg) {
                isVerifying = false;
                showStatus('\u26A0\uFE0F', msg);
                if (widgetId !== null) {
                    turnstile.remove(widgetId);
                }
            }

        })();
    </script>
