ation of China's tech scene for all technology enthusiasts.\",\"community\",{\"_129\":254,\"_255\":256},\"Community Connection\",\"decodeChina\",{\"_129\":257,\"_34\":258,\"_259\":260},\"DecodeChina\",\"A one-week intensive immersion into China's tech scene, occurring bi-monthly to broaden participants' understanding through:\",\"items\",{\"_261\":262,\"_263\":264,\"_265\":266},\"visits\",\"Company visits and networking\",\"courses\",\"Pandaily-designed courses\",\"workshops\",\"Workshops and cultural excursions\",\"data\",{\"_129\":269,\"_270\":271},\"Data Service\",\"pandata\",{\"_129\":272,\"_34\":273,\"_259\":274},\"Pandata\",\"A comprehensive database containing information on China's most influential tech companies, including:\",{\"_275\":276,\"_277\":278,\"_279\":280},\"overviews\",\"Company overviews\",\"biographies\",\"Executive team biographies\",\"stories\",\"Origin stories and developments\",\"byTheNumbers\",{\"_129\":283,\"_34\":284,\"_224\":285},\"By the Numbers\",\"As one of the most popular sources for the international community to learn about China, Pandaily has reached millions around the globe. Though our subscribers hail from all corners of the world, our goal is persistent: to break through the language barrier and strengthen our readers' understanding of China.\",{\"_286\":287,\"_288\":289,\"_290\":291,\"_292\":293,\"_294\":295,\"_296\":297},\"millions\",\"Millions\",\"millionsLabel\",\"Global Readers Reached\",\"weekly\",\"Weekly\",\"weeklyLabel\",\"Podcast Episodes\",\"global\",\"Global\",\"globalLabel\",\"Subscriber Community\",\"cta\",{\"_129\":300,\"_34\":301,\"_302\":303,\"_304\":305},\"Join Our Community\",\"Stay connected with China's evolving tech landscape through our comprehensive coverage and expert insights.\",\"readLatestNews\",\"Read Latest News\",\"listenToPodcast\",\"Listen to Podcast\",\"ENV\",{\"_308\":309,\"_310\":311},\"STRAPI_BASE_URL\",\"https://cms.pandaily.com\",\"GA_MEASUREMENT_ID\",\"G-FZLJC5WJDF\",\"routes/$slug\",{\"_314\":315,\"_379\":380,\"_6\":7,\"_536\":328},\"post\",{\"_316\":317,\"_129\":318,\"_319\":320,\"_321\":322,\"_323\":324,\"_325\":326,\"_327\":328,\"_329\":330,\"_331\":332,\"_333\":334,\"_6\":7,\"_335\":-5,\"_336\":337,\"_347\":-5,\"_348\":349,\"_56\":350,\"_357\":358,\"_370\":371,\"_372\":-5,\"_373\":-5,\"_374\":375,\"_376\":375,\"_377\":378},\"documentId\",\"vu5bl5l35rq6dc8g32qjxzse\",\"Chinese Scientists Develop ContactSeek AI Framework Based on AlphaFold3 Contact Probability: A New Precision Paradigm for Gene Editing Tool Design Published in Nature\",\"slug\",\"contactseek-alphafold3-ai-framework-jul2026\",\"excerpt\",\"Peking University team led by Yi Chengqi and East China Normal University develop ContactSeek using AlphaFold3 contact probability to identify key amino acids for precision base editing tool engineering.\",\"content\",\"\u003cp\u003eA research team led by Professor Yi Chengqi at Peking University School of Life Sciences, in collaboration with Professor Li Dali team at East China Normal University, has published a breakthrough paper in Nature titled Precise DNA Base Editing Using AlphaFold3-Based Contact Modelling, introducing ContactSeek an AI framework that leverages AlphaFold3 contact probability to systematically engineer gene editing tools with significantly improved precision. The paper represents a convergence of AI structural biology and gene editing, demonstrating how protein structure prediction models can directly guide the engineering of therapeutic tools.\u003c/p\u003e\u003cp\u003eThe ContactSeek framework addresses the fundamental challenge in base editing: maintaining high on-target editing activity while minimizing off-target effects. Base editors combine a Cas protein with a deaminase enzyme to directly convert one DNA base to another without requiring double-strand breaks, making them critical tools for both basic research and gene therapy development. However, off-target editing where the editor modifies unintended genomic sites has limited clinical application. The team used AlphaFold3, the DeepMind AI model for protein structure prediction extended to protein-nucleic acid complexes, to predict on-target and off-target DNA-RNA-protein ternary complexes and systematically compare their interaction differences.\u003c/p\u003e\u003cp\u003eThe key insight: AlphaFold3 contact probability, not structural prediction, proved most valuable. Contact probability sensitively captures changes from single-base-pair mismatches and single-amino-acid mutations that predicted structures miss.\u003c/p\u003e\u003cp\u003eIntegrating contact probability with high-throughput off-target editing sequencing data, ContactSeek systematically identified key amino acid residues in both Cas proteins and deaminases that determine editing specificity. Based on this framework, the team engineered a series of novel Cas9 variants for adenine base editors that maintain efficient on-target editing while significantly reducing DNA off-target editing. The variants represent a new generation of precision editing tools with potential applications in treating genetic diseases where editing accuracy is paramount, such as sickle cell disease, beta-thalassemia, and certain inherited metabolic disorders.\u003c/p\u003e\u003cp\u003eThe research opens a new paradigm for protein engineering in gene editing. Rather than relying on labor-intensive trial-and-error mutagenesis or large-scale screening, ContactSeek provides an AI-driven predictive framework that identifies which amino acids to modify for desired functional outcomes. The approach is generalizable beyond base editing to other genome editing tools including prime editors and CRISPR-Cas systems where protein-nucleic acid interaction specificity determines therapeutic safety and efficacy. The Nature publication positions Chinese structural biology and gene editing research at the frontier of AI-guided protein engineering, demonstrating how AlphaFold class models can transition from structure prediction to functional prediction and tool design.\u003c/p\u003e\",\"publishedDate\",\"2026-07-25T14:00:00.000Z\",\"featured\",false,\"viewCount\",0,\"readingTime\",2,\"status\",\"draft\",\"originalWordPressId\",\"featuredImage\",{\"_316\":338,\"_339\":340,\"_341\":-5,\"_342\":-5,\"_343\":344,\"_345\":346},\"fphn7cgm07obofwld4nia2uu\",\"url\",\"https://cms-image.pandaily.com/1/article4_f797b9ae57.png\",\"alternativeText\",\"caption\",\"width\",1672,\"height\",941,\"featuredImageUrl\",\"gallery\",[],[351],{\"_316\":352,\"_11\":353,\"_319\":354,\"_355\":356,\"_34\":-5},\"nd7u5jlcbw44fqibmzu4ckhw\",\"Technology\",\"technology\",\"color\",\"#000000\",\"tags\",[359,363,367],{\"_316\":360,\"_11\":65,\"_319\":64,\"_355\":361,\"_34\":362},\"ji5tef72gjtbd7bx0er6q9jv\",\"#6366f1\",\"\",{\"_316\":364,\"_11\":365,\"_319\":366,\"_355\":361,\"_34\":362},\"l724anxphd5srihp9hkqib88\",\"Peking University\",\"peking-university\",{\"_316\":368,\"_11\":369,\"_319\":369,\"_355\":361,\"_34\":362},\"qij2textw3bgp4wsdiv56033\",\"biology\",\"authors\",[],\"seo\",\"externalVideo\",\"createdAt\",\"2026-07-26T02:13:49.665Z\",\"updatedAt\",\"publishedAt\",\"2026-07-26T02:13:49.699Z\",\"featuredPosts\",[381,408,437,466,495],{\"_316\":382,\"_129\":383,\"_319\":384,\"_321\":385,\"_323\":386,\"_325\":387,\"_327\":388,\"_329\":330,\"_331\":332,\"_333\":389,\"_6\":7,\"_335\":-5,\"_336\":390,\"_347\":-5,\"_56\":393,\"_357\":395,\"_370\":404,\"_372\":-5,\"_373\":-5,\"_374\":405,\"_376\":406,\"_377\":407},\"vm46u55wc5nh25vzl65yr8y6\",\"World Third Strongest With Fable-Level Feel: Moonshot AI 2.8 Trillion Parameter Kimi K3 Breaks Open-Source Records\",\"kimi-k3-2-trillion-open-source-record-jul2026\",\"Moonshot AI releases Kimi K3 with 2.8 trillion parameters, ranking third globally behind Fable 5 and GPT-5.6 Sol, with open-weight release and API service.\",\"\u003cp\u003eMoonshot AI has officially released Kimi K3, a 2.8 trillion parameter open-source foundation model that ranks as the world third strongest on comprehensive benchmarks, with developer tests describing it as delivering Fable-level user experience. The model, already available with API service and developer documentation, is the largest open-source model by parameter count globally and represents a significant milestone in China AI development toward closing the gap with leading US foundation models.\u003c/p\u003e\u003cp\u003eKimi K3 introduces Moonshot self-developed Kimi Delta Attention (KDA) mechanism combining linear attention and Attention Residuals (AttnRes) structure to optimize long-sequence information processing and deep network information flow. The model supports 100 million token context windows with up to 6.3x decoding acceleration through KDA, while AttnRes improves training efficiency by approximately 25% at less than 2% additional cost.\u003c/p\u003e\u003cp\u003eThe model focuses on long-horizon agentic coding and self-evolving workflow capabilities. With a higher-sparsity MoE design featuring 896 expert modules while activating only 16 per inference, K3 balances expanded model capacity against controlled computational cost. It can understand large codebases, call tools, execute tests, and continuously adjust task plans based on feedback, representing a shift from answering questions to completing tasks.\u003c/p\u003e\u003cp\u003eBenchmark results place Kimi K3 in the global top tier. In the GDPval-AA v2 knowledge work test, K3 scored 1687 points, surpassing Claude Opus 4.8 Max (1600) and trailing only Claude Fable 5 Max and GPT-5.6 Sol Max. In the AA-Briefcase agent knowledge work test, K3 scored 1527 points, ranking second only to Claude Fable 5 Max. The model also achieved 91.2 on BrowseComp for long-context information retrieval, leveraging its 100 million token context window without requiring additional context compression.\u003c/p\u003e\u003cp\u003eDeveloper community feedback highlights K3 autonomous planning and execution capabilities in complex agent tasks, continuous programming, and multi-tool orchestration. Several hedge fund evaluations rated K3 performance above Opus 4.8 at approximately 60% of its pricing. The open-weight release strategy follows DeepSeek precedent, allowing global developers to freely download, deploy, and modify the model, creating competitive pressure on closed-model strategy companies like OpenAI and Anthropic. At a time when Anthropic plans to raise Opus 4.8 prices by 50% in September, K3 and other Chinese open-source models present a cost-effective alternative that could reshape the global AI model market dynamics.\u003c/p\u003e\",\"2026-07-17T08:00:00.000Z\",true,\"published\",{\"_316\":391,\"_339\":392,\"_341\":-5,\"_342\":-5,\"_343\":344,\"_345\":346},\"ygx4v5pu8cgxic843zqrtthq\",\"https://cms-image.pandaily.com/1/article1_e6769801a4.png\",[394],{\"_316\":352,\"_11\":353,\"_319\":354,\"_355\":356,\"_34\":-5},[396,400,401],{\"_316\":397,\"_11\":398,\"_319\":399,\"_355\":361,\"_34\":362},\"q5ktywk4z70rf8zxnq5bbabt\",\"Moonshot AI\",\"moonshot-ai\",{\"_316\":360,\"_11\":65,\"_319\":64,\"_355\":361,\"_34\":362},{\"_316\":402,\"_11\":403,\"_319\":403,\"_355\":361,\"_34\":362},\"cipqssdhm3pbuuk4gple3qxz\",\"kimi\",[],\"2026-07-17T02:02:16.538Z\",\"2026-07-17T03:38:01.739Z\",\"2026-07-17T03:38:01.811Z\",{\"_316\":409,\"_129\":410,\"_319\":411,\"_321\":412,\"_323\":413,\"_325\":387,\"_327\":388,\"_329\":330,\"_331\":332,\"_333\":389,\"_6\":7,\"_335\":-5,\"_336\":414,\"_347\":-5,\"_56\":417,\"_357\":420,\"_370\":433,\"_372\":-5,\"_373\":-5,\"_374\":434,\"_376\":435,\"_377\":436},\"im82va13re6zj59a49b2ul13\",\"WAIC 2026 Top 10 Highlights: Chinese Chips Line Up in Full Force as AI Enters the Industrial Era\",\"waic-2026-top-10-highlights-chinese-chips-jul2026\",\"WAIC 2026 opens with 100+ chip companies, supernode clusters, humanoid robots, and 64 consumer AI products across three Shanghai zones.\",\"\u003cp\u003eThe 2026 World Artificial Intelligence Conference opened in Shanghai on July 17 across three major zones covering Zhangjiang, World Expo, and Xuhui West Bund, forming the largest WAIC in history. The theme Intelligent Partners, Co-Creating the Future reflects a fundamental shift from model capability demonstrations to industrial application deployment, with domestic chip full-lineup showcases, supernode computing clusters taking center stage, humanoid robots entering real factories, and consumer AI products becoming hands-on experiences.\u003c/p\u003e\u003cp\u003eZhangjiang Science Hall presents the hardware ceiling of the conference with over 100 computing chip and infrastructure companies displaying 200 exhibits including 67 domestic first launches. A dozen general computing chip companies compete on the same stage. Highlight exhibits include Dongfang Suanxin DF1000, China first large-scale AI chip built on mature 14nm process claiming 4nm-equivalent performance through a third-way architecture innovation. Other chip companies including Muxi, Tianshu Zhixin, and Moore Threads showcase their latest products with live training demonstrations.\u003c/p\u003e\u003cp\u003eThe World Expo H2 hall is dominated by supernode systems. Huawei debuts Atlas 950 SuperPoD with 1024 Ascend cards on display, while the Atlas 950 SuperCluster can scale to 500,000 cards. Sugon Dawn 8000 scaleX shows the 100K-card fully domestic AI super-fusion cluster with over 300 optimized applications. Alibaba Zhenwu M890 and ZTE OEX supernodes complete the lineup, enabling direct comparison of competing supernode technical approaches.\u003c/p\u003e\u003cp\u003eH3 Embodied Intelligence Hall features 161 companies and 314 exhibits. Xuanshi highlights include Unitree GD01 world first manned deformable mecha capable of switching between humanoid and quadruped forms. Zhiyuan demonstrates a production line replicated on the expo floor. Fourier debuts GR Nano desktop companion robot. Qianshun Intelligence Moz1 performs long-horizon single-instruction room organization tasks. Multiple companies demonstrate robot pharmacies, coffee bars, and other real-world applications.\u003c/p\u003e\u003cp\u003eSustainable Xuhui West Bund presents 64 consumer AI products for hands-on experience. Honor Robot Phone, Bubbo 1 companion robot, multiple AR smart glasses from Rokid, Liangliang Vision, Xinmou Technology, and Ant Group are available for user testing. Music generation, video creation, and virtual human interaction stations round out the consumer experience zone. The conference structure itself signals that AI industry has moved beyond model competition into a phase where infrastructure, terminals, applications, and ecosystems compete as integrated systems.\u003c/p\u003e\",{\"_316\":415,\"_339\":416,\"_341\":-5,\"_342\":-5,\"_343\":344,\"_345\":346},\"nap5nzjw3ij04ndv27sgqv4s\",\"https://cms-image.pandaily.com/1/article2_fb9350fec2.png\",[418],{\"_316\":419,\"_11\":59,\"_319\":58,\"_355\":356,\"_34\":362},\"u9uewvwvdfl4hd8yy6xyqkwq\",[421,425,429],{\"_316\":422,\"_11\":423,\"_319\":424,\"_355\":361,\"_34\":362},\"pn2of6p1b3ukwko2147hx8rm\",\"WAIC\",\"waic\",{\"_316\":426,\"_11\":427,\"_319\":428,\"_355\":361,\"_34\":-5},\"kntxzq3cpf7q91yqp2bvpe1h\",\"AI Infrastructure\",\"ai-infrastructure-tag\",{\"_316\":430,\"_11\":431,\"_319\":432,\"_355\":361,\"_34\":362},\"x4rcbmu97kiw4ayqunjpq2lb\",\"AI Chip\",\"ai-chip\",[],\"2026-07-17T02:02:33.894Z\",\"2026-07-17T03:37:24.641Z\",\"2026-07-17T03:37:24.746Z\",{\"_316\":438,\"_129\":439,\"_319\":440,\"_321\":441,\"_323\":442,\"_325\":443,\"_327\":388,\"_329\":330,\"_331\":444,\"_333\":389,\"_6\":7,\"_335\":-5,\"_336\":445,\"_347\":-5,\"_56\":450,\"_357\":453,\"_370\":462,\"_372\":-5,\"_373\":-5,\"_374\":463,\"_376\":464,\"_377\":465},\"f4k3e632bto2dxb6s9cl7qt9\",\"XPENG Brand Day \u0026 Global Launch of MONA L03\",\"xpeng-mona-l03-global-launch-munich-jul2026\",\"XPENG launches MONA L03 globally in Munich, available in 65 countries with BEV and EREV options. Features Turing AI ADAS, smart cockpit, and dual-powertrain strategy.\",\"\u003cp\u003e[Munich, Germany, July 16, 2026] â Today, XPENG held its \\\"XPENG LIVE: PHYSICAL AI FOR ALL\\\" brand day and the global launch of the MONA L03 in Munich, officially introducing the first global model of the MONA series. The MONA L03 will be available for sale in 65 countries worldwide starting this year. Designed for young global users, the model incorporates global design, R\u0026D, and safety standards across its styling, smart cockpit, AI-assisted driving, dual powertrain options, and safety features, aiming to offer a smarter and higher-quality mobility experience.\u003c/p\u003e\\n\\n![å¾ç2.png](https://cms-image.pandaily.com/1/2_3546600ff6.png)\\n\\n\u003ch2\u003eMONA L03 Global Launch â Designed for Young Users Worldwide\u003c/h2\u003e\\n\\n\u003cp\u003eDeveloped as a globally synchronized model, the MONA L03 was designed, engineered, and validated to meet aesthetic and usage standards across multiple markets, positioning it as a smart, fashion-oriented SUV with international appeal.\u003c/p\u003e\\n\\n\u003cp\u003eThe design team, led by JuanMa Lopez, XPENG's Vice President of Design and former head of exterior design at Ferrari, adopted the \\\"Vital Flow\\\" concept, integrating aerodynamics with a youthful design language. Features such as a wide fastback profile, frameless doors, flush side windows, and a large-curvature rear window contribute to a sleek stance with a drag coefficient of Cd 0.228. This design improves range while giving the vehicle a futuristic and sporty look, aligning aesthetics with performance and efficiency.\u003c/p\u003e\\n\\n![å¾ç3.png](https://cms-image.pandaily.com/1/3_d8a4fc3e2f.png)\\n\\n\u003cp\u003eTo accommodate diverse user habits, the MONA L03 features an upgraded smart cockpit system with the overseas version of XOS 6, offering an intuitive interactive experience. XOS 6 accurately executes explicit commands (navigation, climate control) and also understands natural, open-ended, or even emotional expressions, engaging in free-form dialogue based on context. For Europe's multilingual environment, it supports mixed-language recognition (English, German, French, etc.), allowing passengers to converse naturally without switching languages.\u003c/p\u003e\\n\\n\u003cp\u003eBeyond smart features, the cockpit emphasizes comfort, with a 26.8-inch W-HUD, 20-speaker AI sound system, 14-point massage and zero-gravity front passenger seat, suede headliner, and over 72% soft-touch surface coverage. The cabin offers 40 storage spaces, a 102-liter front trunk (BEV), and a 539-liter rear trunk expandable to 1,640 liters, plus 23 accessory mounting points and provisions for tow hooks and roof rails, accommodating commuting, travel, camping, and content creation needs.\u003c/p\u003e\\n\\n![img_16.jpg](https://cms-image.pandaily.com/1/img_16_e95751c2d0.jpg)\\n\\n\u003cp\u003eGiven differing energy structures, charging conditions, and travel patterns across regions, the MONA L03 offers both BEV and EREV options. The BEV version has a CLTC range of up to 650 km and energy consumption of 11.5 kWh/100 km. The EREV version delivers a CLTC electric range of 325 km and a combined range of 1,380 km, with a WLTC fuel consumption of 4.96 L/100 km in charge-depleting mode. The model represents XPENG's \\\"dual-powertrain\\\" strategy, with its EREV system providing extended electric driving, reduced range anxiety, and a quiet EV-like experience, complemented by fast-charging, low energy use, and AI-based safety monitoring.\u003c/p\u003e\\n\\n![img_13.jpg](https://cms-image.pandaily.com/1/img_13_933cb3fc13.jpg)\\n\\n\u003ch2\u003eXPENG's Advanced ADAS Goes Global â A Single Model for China and Europe\u003c/h2\u003e\\n\\n\u003cp\u003eFrom early highway assisted driving to urban navigation assistance in over 200 cities, XPENG has continued to advance its ADAS capabilities. In March of this year, the second-generation VLA (Vision-Language-Action) model, branded as Turing AI ADAS, was rolled out to users, with assisted driving accounting for over 50% of total mileage in the first month. Notably, the Turing VLA model is designed to cover both L2 assisted driving and L4 autonomous driving with a single architecture; the L4-level XPENG Robotaxi using this model has entered internal employee testing.\u003c/p\u003e\\n\\n\u003cp\u003eRecently, XPENG Chairman and CEO He Xiaopeng and Head of General AI Center Liu Xianming completed local validation testing of the Turing AI ADAS in Germany. The model, trained primarily on Chinese road data, demonstrated strong adaptability and stability in Europe, requiring minimal additional training data to handle urban arterials, narrow alleys, sharp curves, obstacle avoidance, and pedestrian yielding. For Europe's complex right-of-way and road environments, the system emphasizes pedestrian priority, traffic sign recognition, and implicit traffic rule understanding. XPENG is the first Chinese company to use the same model for both China and Europe and is accelerating production adaptation for the European market.\u003c/p\u003e\\n\\n![img_6.jpg](https://cms-image.pandaily.com/1/img_6_5f7e8db5c6.jpg)\\n\\n\u003cp\u003eLiu Xianming noted that autonomous driving is essentially a physical AI problem â understanding real-world physical dynamics is the foundation of the Turing VLA model. Unlike traditional solutions relying on high-definition maps and preset rules, the model leverages its understanding of physical scenes to perceive unfamiliar roads, interpret contextual semantics, and make flexible driving decisions. Through a \\\"VLA + World Model\\\" reinforcement learning framework, it continuously improves real-world understanding and decision-making. Liu described the world model and VLA as two sides of the same coin, mutually reinforcing through different training signals. To address limited overseas training data, the world model generates realistic, continuous, physically plausible data, enhancing the model's generalization across different countries and road conditions.\u003c/p\u003e\\n\\n\u003ch2\u003eDeepening Global R\u0026D and Operations to Accelerate Physical AI Deployment Worldwide\u003c/h2\u003e\\n\\n\u003cp\u003eA truly global product requires not only product competitiveness but also long-term support from R\u0026D, manufacturing, supply chain, service, and ecosystem development. XPENG continues to build localized capabilities to support the global deployment of physical AI.\u003c/p\u003e\\n\\n\u003cp\u003eIn Europe, XPENG follows an \\\"In Europe, For Europe\\\" approach, enhancing local R\u0026D, production, sales, and service. It has established an independent R\u0026D center in Munich covering product development, user services, and charging infrastructure; partnered with Magna's plant in Austria for localized production (with G6 and G9 already rolling off); and collaborates with global suppliers such as Bosch, Continental, and ZF on technology and supply chains, while working with over 150 dealers to expand across Europe.\u003c/p\u003e\\n\\n![img_7.jpg](https://cms-image.pandaily.com/1/img_7_1423bbbc30.jpg)\\n\\n\u003cp\u003eEurope remains a key growth market. Over 60,000 European users have chosen XPENG. In May, the XPENG G9 ranked first among Chinese-brand BEV large SUVs in France, Denmark, Portugal, and Norway, while the G6 ranked first among Chinese-brand midsize SUVs in Germany, France, Denmark, Portugal, and Norway.\u003c/p\u003e\\n\\n\u003cp\u003eTo date, XPENG's cumulative global sales exceed 1.2 million units, with a sales network covering 65 countries and regions and over 1,200 stores. Its fast-charging network spans 31 countries and regions, with access to over 2.7 million charging points.\u003c/p\u003e\\n\\n\u003cp\u003eAs globalization progresses, XPENG is extending physical AI capabilities from intelligent vehicles to broader physical scenarios, focusing on three areas: AI cars, humanoid robots, and flying cars. These share a common full-stack physical AI technology base, enabling unified AI development across different smart devices.\u003c/p\u003e\\n\\n\u003cp\u003eThe humanoid robot, after eight years of development, has achieved advances in anthropomorphic form, automotive-grade safety, mass-production readiness, and on-device AI, with plans to enter global commercial settings in 2027. The flying car has accumulated over 7,000 orders, and the world's first flying car factory with an annual capacity of 10,000 units has been completed, accelerating mass production.\u003c/p\u003e\\n\\n![img_9.jpg](https://cms-image.pandaily.com/1/img_9_cdc7ade882.jpg)\\n\\n\u003cp\u003eGoing forward, XPENG will continue to increase R\u0026D investment to bring physical AI technology from China to the world, enabling AI applications in more real-world scenarios and delivering safer, more efficient, and smarter mobility experiences for global users.\u003c/p\u003e\",\"2026-07-17T05:50:21.000Z\",6,{\"_316\":446,\"_339\":447,\"_341\":-5,\"_342\":-5,\"_343\":448,\"_345\":449},\"tp8ekbnn8df3m6nxfba4qdh0\",\"https://cms-image.pandaily.com/1/1_9acda20c02.png\",2786,1566,[451],{\"_316\":452,\"_11\":73,\"_319\":72,\"_355\":356,\"_34\":362},\"sxqv5wtxm67bt4hbdptijger\",[454,458],{\"_316\":455,\"_11\":456,\"_319\":457,\"_355\":361,\"_34\":362},\"h96r38erorswkuuma2h4ecyb\",\"Xpeng G3\",\"xpeng-g3\",{\"_316\":459,\"_11\":460,\"_319\":461,\"_355\":361,\"_34\":362},\"mlhvdd2f7cr9wfoqefxbf6d5\",\"ADAS\",\"adas\",[],\"2026-07-17T05:50:25.854Z\",\"2026-07-17T06:12:20.992Z\",\"2026-07-17T06:12:21.084Z\",{\"_316\":467,\"_129\":468,\"_319\":469,\"_321\":470,\"_323\":471,\"_325\":472,\"_327\":388,\"_329\":330,\"_331\":473,\"_333\":389,\"_6\":7,\"_335\":-5,\"_336\":474,\"_347\":-5,\"_56\":477,\"_357\":479,\"_370\":491,\"_372\":-5,\"_373\":-5,\"_374\":492,\"_376\":493,\"_377\":494},\"cboea6r8jkk0bsep2ro27nur\",\"ZTE Nubia vs StepFun: The Showdown Over AI Agent Smartphones Heats Up This Summer\",\"nubia-stepfun-agent-phone-showdown-jul2026\",\"Nubia debuts world first AI agent phone at WAIC while StepFun launches STEPX Neo with Step AOS and Amoo agent, as the agent phone era officially begins with competing visions.\",\"\u003cp\u003eThe battle for the AI agent smartphone market has officially begun, with ZTE subsidiary Nubia and AI company StepFun both preparing to launch their vision of the first native agent phones at the World Artificial Intelligence Conference. Nubia confirms its new entry will debut on July 17, while StepFun launched STEPX Neo on July 13 with a full ecosystem of agent-native operating system, hardware, and partners.\u003c/p\u003e\u003cp\u003eNubia Ni Fei, president of ZTE Terminal Business Division, outlined the company vision. Current AI phones merely stack features on existing operating systems, requiring users to switch between multiple apps for complex tasks. The new generation uses a native agent approach where the phone understands user intent, remembers preferences, executes complete tasks across apps, and protects privacy and security. The device marks Nubia second AI phone generation after the December 2025 nubia M153 engineering prototype with ByteDance Doubao.\u003c/p\u003e\u003cp\u003eStepFun moved first, launching STEPX Neo with its Step AOS agent-native operating system and Amoo personal agent. The system uses a dual-domain three-stage memory architecture, end-cloud collaboration for task execution, and atomic service engines that decompose app functions into agent-accessible modules. StepFun has secured ecosystem partnerships with Alipay, Meituan, Amap, JD, Didi, and Baidu for cross-app service invocation. Chairman Yin Qi stated the company does not prioritize shipment volume in the first phase but aims to get early users onto the platform as quickly as possible.\u003c/p\u003e\u003cp\u003eThe two approaches reveal different strategies. Nubia leverages its decade of smartphone engineering experience and the ByteDance Doubao model ecosystem, benefiting from established manufacturing and distribution capabilities. StepFun bets on a vertically integrated model-hardware-OS approach, controlling the full stack from foundation models to the user interface. Step AOS is built from the ground up for agent-native interaction, with end-cloud task splitting, atomic service engines, and a security model with auditable, reversible operations.\u003c/p\u003e\u003cp\u003eBoth face the same fundamental challenge: building a reliable agent ecosystem. An agent phone is useless if it cannot actually execute real-world tasks across the thousands of apps users depend on. Nubia and ByteDance pilot showed that early agent performance was inconsistent, with some demo scenarios not reliably reproducible. StepFun early partnerships with major internet platforms give it a head start on ecosystem breadth, but execution quality depends on each partner API reliability and permission granularity.\u003c/p\u003e\u003cp\u003eThe market context is favorable. National 15th Five-Year Plan explicitly targets over 90% adoption of new-generation intelligent terminals by 2030. IDC data shows Chinese smartphone shipments declined 3.3% year-on-year in Q1 2026, creating urgent need for innovation-driven upgrade cycles. Whether agents prove compelling enough to drive consumer demand will determine if the agent phone category becomes the next smartphone revolution or a niche product for early adopters.\u003c/p\u003e\",\"2026-07-14T08:00:00.000Z\",3,{\"_316\":475,\"_339\":476,\"_341\":-5,\"_342\":-5,\"_343\":344,\"_345\":346},\"ebc7e85j3szaw0y0loc70mhe\",\"https://cms-image.pandaily.com/1/article3_b5f62a21a4.png\",[478],{\"_316\":352,\"_11\":353,\"_319\":354,\"_355\":356,\"_34\":-5},[480,484,488],{\"_316\":481,\"_11\":482,\"_319\":483,\"_355\":361,\"_34\":362},\"qc0t9plntnug7s33bs95xowk\",\"Nubia\",\"nubia\",{\"_316\":485,\"_11\":486,\"_319\":487,\"_355\":361,\"_34\":-5},\"z9sl590dgur92ffy5w4o39vq\",\"AI Agents \",\"ai-agents\",{\"_316\":489,\"_11\":490,\"_319\":490,\"_355\":361,\"_34\":362},\"bcxkpxab77mxuxlkj1kd0lv7\",\"smartphone\",[],\"2026-07-14T02:03:30.881Z\",\"2026-07-17T03:40:48.583Z\",\"2026-07-17T03:40:48.731Z\",{\"_316\":496,\"_129\":497,\"_319\":498,\"_321\":499,\"_323\":500,\"_325\":501,\"_327\":388,\"_329\":330,\"_331\":502,\"_333\":389,\"_6\":7,\"_335\":-5,\"_336\":503,\"_347\":-5,\"_56\":508,\"_357\":511,\"_370\":532,\"_372\":-5,\"_373\":-5,\"_374\":533,\"_376\":534,\"_377\":535},\"mmse2foiyudc0uk3mom59kb9\",\"Lenovo Built the AI Engine Behind the 2026 World Cup â Here's How It Performed on Opening Night\",\"lenovo-built-the-ai-engine-behind-the-2026-world-cup-here-s-how-it-performed-on-opening-night\",\"For the global tech industry, the real story was unfolding behind the broadcast feed. Every one of those pivotal moments â the early goal, the VAR-reviewed red cards, the offside checks â ran through AI systems built and deployed by Lenovo, FIFA's official technology partner and the first Chinese company ever to occupy that role at a World Cup.\",\"On the evening of June 12, inside Mexico City's legendary Estadio Azteca, host nation Mexico dispatched South Africa 2â0 in the opening match of the 2026 FIFA World Cup. JuliÃ¡n QuiÃ±ones struck in the ninth minute â the fastest opening-match goal since 2006 â and RaÃºl JimÃ©nez headed in a second midway through the second half. Three red cards, a World Cup record for an opener, added to the drama.\\nBut for the global tech industry, the real story was unfolding behind the broadcast feed. Every one of those pivotal moments â the early goal, the VAR-reviewed red cards, the offside checks â ran through AI systems built and deployed by Lenovo, FIFA's official technology partner and the first Chinese company ever to occupy that role at a World Cup.\\n## From Shaky Bodycam to Broadcast-Grade First-Person View\\nThe most visible piece of Lenovo's technology stack was the Referee View Al Stabilizer. Match officials have worn chest-mounted cameras for years, but the raw footage â captured while sprinting and pivoting through physical confrontations â has always been too jittery for live broadcast. Lenovo's AI-driven image stabilization pipeline processes the feed in real time with sub-two-second latency, reducing motion distortion by up to 50% while preserving the authentic first-person perspective.\\n![101781440114_.pic.jpg](https://cms-image.pandaily.com/101781440114_pic_17ff1e6f17.jpg)\\nFor the first time in World Cup history, billions of viewers could watch a goal unfold from the referee's own line of sight. When QuiÃ±ones fired his low shot past the goalkeeper, audiences around the world experienced the moment not from a distant camera tower but from the vantage point of the official standing meters away. Later, when South Africa's Siyabonga Siswana was sent off following a VAR review, the referee-cam replay offered an unprecedented window into the split-second judgment calls that define the modern game.\\n## 3D Digital Avatars and \\\"Scalp-Level\\\" Offside Calls\\nLenovo's **3D Digital Avatars** tackled what is perhaps the sport's most contentious flashpoint: offside decisions. Trained on hundreds of thousands of body-scan data points, the system auto-generated accurate 3D digital replicas of all 1,248 players in the tournament â an industry first. Rather than relying on flat 2D broadcast angles, VAR officials can now rotate a fully rendered 3D scene to verify offside positions down to what FIFA internally calls \\\"scalp-level precision.\\\"\\nIn the opener, the technology was put to immediate use. All three red-card incidents and multiple offside calls were rendered through the 3D visualization pipeline, giving both officials and viewers a transparent, angle-independent view of each decision. Johannes HolzmÃ¼ller, FIFA's Director of Innovation, has described the system as a major leap in both the accuracy and the public credibility of refereeing.\\n## An AI Tactical Brain That Turns Two Days Into Two Hours\\nLess visible to viewers but potentially more transformative for the sport itself is the **FIFA AI Pro** â the first FIFA-certified generative AI knowledge assistant for football. The system ingests millions of data points per match across more than 2,000 performance metrics. Coaching staffs can query it in natural language: ask for a comparison of set-piece conversion rates, request a tactical breakdown of an opponent's high-press patterns, or generate a scouting report on a substitute.\\nPost-match analysis that previously required two full days of manual video review can now be completed in roughly two hours. For a tournament that has expanded to 48 teams across 16 cities in three countries, that kind of efficiency gain is not a luxury â it is an operational necessity.\\n## The Infrastructure Beneath the AI\\nNone of these AI applications would function without the edge-computing backbone Lenovo installed across all tournament venues. Pure cloud solutions cannot meet the latency and reliability requirements of live global broadcasting, so Lenovo deployed on-site **ThinkSystem servers** to handle real-time data throughput for streaming, predictive fault scheduling, and decision-support systems. ThinkPad laptops and Lenovo smartphones round out the device fleet powering day-to-day tournament operations. Across the three host countries, Intelligent Command Center and Technology Command Center Observability give organizers a unified, AI-augmented view of every venue simultaneously.\\nThe scale of the challenge is staggering. The 2026 World Cup is the largest ever staged â 48 teams, 104 matches, an estimated 60 billion cumulative viewers, and data volumes projected at thousands of times the 2022 edition. Operating under near-zero tolerance for downtime, the opening match served as a high-stakes systems integration test that Lenovo's hybrid AI architecture passed cleanly.\\n## A 24-Year Arc: From the Pitch to the Tech Stack\\nThe narrative symmetry was hard to miss. On the same evening, a gala dinner in Mexico City â hosted by Tencent News and titled \\\"Night of Dreams: Civilization and Intelligence\\\" â brought together football legend Bora MilutinoviÄ, Lenovo Group vice president Carol Chen, sports broadcasters, and cultural figures. MilutinoviÄ, who coached Mexico to the quarterfinals at Azteca in 1986 and later led China to its only World Cup appearance in 2002, reflected on the arc: twenty-four years ago, Chinese football reached the World Cup stage through its players; today, Chinese technology is embedded in the tournament's core operating system.\\nThe shift mirrors a broader evolution for Chinese companies on the global sports stage. Earlier generations of Chinese brands participated in international events primarily as sponsors â logo placements on perimeter boards. Lenovo's role at this World Cup is fundamentally different. The company is not buying visibility; it is building the technical infrastructure that makes the event function. From the Olympics to Formula 1 and now FIFA, Lenovo has moved from hardware supplier to end-to-end AI solutions provider for the world's most demanding live-event environments.\\n## Beyond the Stadium: Community Football and Consumer AI\\nLenovo is also using the World Cup moment to push its AI capabilities downstream. Through its global \\\"Work For Humankind\\\" initiative and the \\\"Your Club, Your Canvas\\\" program, the company brought generative AI tools to grassroots football. A community team in Beijing called \\\"Wellness United\\\" used Lenovo's AI system Qira (Tianxi AI in China) to design custom jerseys that fuse street-culture aesthetics with football identity. The team's designers then connected remotely with elementary school students in rural Yunnan province, guiding the children through their first-ever AI-assisted creative project â designing their own team kits from over 2,000 kilometers away.\\nMeanwhile, on the consumer front, Lenovo launched a \\\"World Cup Prediction: Human vs. AI\\\" campaign in Beijing, pitting its Qira (Tianxi in China) AI agent against 11 leading Chinese AI models â including DeepSeek, Kimi, Ernie Bot, and Qwen â in a tournament-long prediction contest open to public participation. The initiative transforms passive viewership into interactive engagement while stress-testing multiple AI systems in a sustained, real-world scenario across all 104 matches.\\n## What Comes Next\\nCarol Chen framed the opening match as a beginning rather than a culmination. \\\"The World Cup is just a starting point,\\\" she said. \\\"As hybrid AI matures, it will gradually integrate into athletic training, event operations, content distribution, and fan interaction. We want to take the capabilities validated on the World Cup stage and distill them into replicable, scalable solutions.\\\"\\nLenovo has already begun that process domestically. A strategic partnership with the Chinese Football Association will bring World Cup-grade smart-sports technology to the Chinese Super League. Parallel initiatives target youth academies and school football programs, aiming to democratize access to the same analytical and visualization tools now available to World Cup coaching staffs.\\nThe opening whistle at Azteca was, in one sense, just the start of a football tournament. In another, it marked the moment that AI stopped being a sideshow add-on to elite sport and became part of the operating system â and that a Chinese technology company proved it could build that system for the biggest stage on earth.\",\"2026-06-14T12:59:50.311Z\",7,{\"_316\":504,\"_339\":505,\"_341\":-5,\"_342\":-5,\"_343\":506,\"_345\":507},\"n85jgvoo6wl8jozem1xclw8x\",\"https://cms-image.pandaily.com/81781439606_pic_d0513e77eb.jpg\",600,339,[509],{\"_316\":510,\"_11\":65,\"_319\":64,\"_355\":356,\"_34\":362},\"ou7tkn9cq6eba9jr68hqiwch\",[512,516,520,524,528],{\"_316\":513,\"_11\":514,\"_319\":515,\"_355\":361,\"_34\":-5},\"hvio3sza2xrdrp3z0u8wfjcu\",\"World Cup 2026\",\"world-cup-2026-tag\",{\"_316\":517,\"_11\":518,\"_319\":519,\"_355\":361,\"_34\":362},\"n2uu4sdwz1gizjdenghn1e0v\",\"Lenovo\",\"lenovo\",{\"_316\":521,\"_11\":522,\"_319\":523,\"_355\":361,\"_34\":362},\"cioqpkdtdi1m78uxfpyrckvh\",\"Artificial Intelligence\",\"artificial-intelligence\",{\"_316\":525,\"_11\":526,\"_319\":527,\"_355\":361,\"_34\":-5},\"qj8wznxhxz877vp5stkozhua\",\"Technologies\",\"technologies-1\",{\"_316\":529,\"_11\":530,\"_319\":531,\"_355\":361,\"_34\":362},\"zjc80kqzgfezdi6z7o5z2b35\",\"3D\",\"3d\",[],\"2026-06-14T12:50:09.325Z\",\"2026-06-14T12:59:50.140Z\",\"2026-06-14T12:59:50.265Z\",\"isDraft\",\"actionData\",\"errors\"]\n");</script><!--$--><script>window.__remixContext.streamController.close();</script><!--/$--><!--/$-->
